name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxis
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck (errores)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error

      - name: Tests
        run: |
          bash tests/render-test.sh
          bash tests/preflight-test.sh
          bash tests/wrapper-test.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxis
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Tests (bash 3.2 y shasum)
        run: |
          bash tests/render-test.sh
          bash tests/preflight-test.sh
          bash tests/wrapper-test.sh
