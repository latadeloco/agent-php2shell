name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxis
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck (errores)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error

      - name: Tests
        run: |
          bash tests/render-test.sh
          bash tests/preflight-test.sh
          bash tests/wrapper-test.sh
          bash tests/triage-test.sh
          bash tests/rules-test.sh
          bash tests/session-audit-test.sh
          bash tests/bt-wrapper-test.sh
          bash tests/bt-script-test.sh
          bash tests/session-config-test.sh
          bash tests/prompt-budget-test.sh
          bash tests/wiki-test.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxis
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Tests (bash 3.2 y shasum)
        run: |
          bash tests/render-test.sh
          bash tests/preflight-test.sh
          bash tests/wrapper-test.sh
          bash tests/triage-test.sh
          bash tests/rules-test.sh
          bash tests/session-audit-test.sh
          bash tests/bt-wrapper-test.sh
          bash tests/bt-script-test.sh
          bash tests/session-config-test.sh
          bash tests/prompt-budget-test.sh
          bash tests/wiki-test.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Sintaxis
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Render y wrapper (Git Bash)
        run: |
          bash tests/render-test.sh
          bash tests/wrapper-test.sh
          bash tests/triage-test.sh
          bash tests/rules-test.sh
          bash tests/session-audit-test.sh
          bash tests/bt-wrapper-test.sh
          bash tests/bt-script-test.sh
          bash tests/session-config-test.sh
          bash tests/prompt-budget-test.sh
          bash tests/wiki-test.sh

      - name: Instalación en HOME temporal
        run: |
          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"
          export XDG_CONFIG_HOME="$HOME/.config"
          ./install.sh --target claude-code --yes
          test -f "$HOME/.claude/agents/php2shell.md"
          grep -q "Base y créditos" "$HOME/.claude/agents/php2shell.md"
